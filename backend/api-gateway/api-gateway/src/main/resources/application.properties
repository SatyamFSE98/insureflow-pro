spring.application.name=api-gateway

server.port=8080


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# User Service Route
spring.cloud.gateway.server.webmvc.routes[0].id=user-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/v1/users/**

# Policy Service Route
spring.cloud.gateway.server.webmvc.routes[1].id=policy-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://policy-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/v1/policies/**

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always