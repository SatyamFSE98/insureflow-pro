server.port = 8082
spring.application.name=policy-service

spring.datasource.url=jdbc:mysql://localhost:3306/insureflow_policy_db
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#user.service.base-url=http://localhost:8081/api/v1/users
user.service.url=http://localhost:8081

resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.slidingWindowSize=5
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.permittedNumberOfCallsInHalfOpenState=2
